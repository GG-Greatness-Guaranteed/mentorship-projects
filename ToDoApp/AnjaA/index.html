<!DOCTYPE html>
<html lang="en">
<head>
    <title>TO-DO APP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navigacija">
        <h1 class="naziv">ToDo</h1>
        <nav>
            <a href="#">Link1</a>
            <a href="#">Link2</a>
            <a href="#">Link3</a>
        </nav>
    </header>
    <main>
        <section>
            <div class="bijeliPravougaonik">
                <input type="text" placeholder="Enter task here..." id="taskInput">
                <div class="dugmadRed fixed-container">
                    <button id="datePicker">DateTime Picker</button>
                    <button id="addButton">ADD</button>
                </div>
            </div>
        </section>
        <section>
            <div class="listaTaskova" id="tasksContainer">
                <h2>Tasks</h2>
                <ul class="taskList" id="taskList">
                    <li class="item" data-id="1" data-date="2023-01-23">
                        <p>Go to the gym</p>
                        <span class="taskDate">
                            January<br>23
                            <img src="resources/trash.png" alt="Delete Icon" class="deleteIcon">
                        </span>
                    </li>
                    <li class="item" data-id="2" data-date="2023-07-09">
                        <p>Learn javascript</p>
                        <span class="taskDate">
                            July<br>09
                            <img src="resources/trash.png" alt="Delete Icon" class="deleteIcon">
                        </span>
                    </li>
                </ul>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
