<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task 1</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body style="background-color:#262626;">

        <div class="header">
            
            <div class="title">
                <h1> ToDo </h1>
            </div>

            <div class="links">
                <ul class="linkList">
                    <li><a href="https://www.google.com">Link 1</a></li>
                    <li><a href="https://www.google.com">Link 2</a></li>
                    <li><a href="https://www.google.com">Link 3</a></li>
                </ul>
            </div>

        </div>

        <br>

        <div class="enterBlock" style="background-color:white">

            <input id="enteredText" type="text" placeholder="Enter task here...">

            <div class = "buttons">
                <button type="submit" id="dateTimeAdd">
                    <h1> DateTime Picker </h1>
                </button>
                <button type="submit" id="addButton">
                    <h1> ADD </h1>
                </button>
            </div>

        </div>

        <br>

        <div class="taskBlock" style="background-color:white">
            <h1> Tasks </h1>

            <div class = "tasks">
                
                <div class="task"> 
                    <h1 class="taskName"> Go to the gym</h1>
                    <button type="submit" class="taskDate">
                        <h2> January </h2>
                        <h1> 23 </h1>
                    </button>
                </div> 

                <div class="task"> 
                    <h1 class="taskName">Learn javascript</h1>
                    <button type="submit" class="taskDate">
                        <h2> July </h2>
                        <h1> 09 </h1>
                    </button>
                </div>
                
            </div>

        </div>
     
        <br>

        <script src="index.js"></script>
    </body>

</html>
