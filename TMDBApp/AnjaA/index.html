<!DOCTYPE html>
<html lang="en">
    <head>
        <title>TMBD app</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <aside class="sidebar">
                <div class="logo">
                    <img src="gg-logo.png" alt="Logo">
                    <h1>TMBD Movies</h1>
                </div>
                <nav>
                    <ul>
                        <li>Popular</li>
                        <li>Now playing</li>
                        <li>Upcoming</li>
                        <li>Top rated</li>
                    </ul>
                </nav>
            </aside>
        
            <main class="content">
                <header class="top-section">
                    <div class="nav-buttons">
                        <button class="nav-arrow left">&#9664;</button>
                        <button class="nav-arrow right">&#9654;</button>
                    </div>
                    <input type="text" placeholder="Search for movies..." class="search-bar">
                
                    <div class="top-controls">
                        <div class="dropdown">

                            <!--sortiranje-->
                            <button class="dropdown-btn" id="sort-btn">Sort</button>
                            <div class="dropdown-menu" id="sort-menu">
                                    <button>Popularity ascending</button>
                                    <button>Popularity descending</button>
                                    <button>Rating ascending</button>
                                    <button>Rating descending</button>
                                    <button>Release date ascending</button>
                                    <button>Release date descending</button>
                            </div>
                        </div>
                
                        <div class="dropdown">
                            <button class="dropdown-btn" id="filter-btn">Filters</button>
                            <div class="dropdown-menu" id="filter-menu">

                                <!--filteri-->
                                <label class="checkbox-label">
                                    <input type="checkbox" id="filter-date"> Release date
                                </label>
                                <div class="date-filters">
                                    <label for="from-date">From:</label>
                                    <input type="date" id="from-date">
                                    <label for="to-date">To:</label>
                                    <input type="date" id="to-date">
                                </div>
                               
                                <label class="checkbox-label">
                                    <input type="checkbox" id="filter-genre"> Genres
                                </label>
                                <div class="genre-buttons">
                                    <button>Action</button>
                                    <button>Horror</button>
                                    <button>Comedy</button>
                                    <button>Crime</button>
                                    <button>Adventure</button>
                                </div>
                
                                <label class="checkbox-label">
                                    <input type="checkbox" id="filter-language"> Language
                                </label>
                                <select id="language">
                                    <option>English</option>
                                </select>

                            </div>
                        </div>
                    </div>
                </header>                                

                <div class="featured-movie">
                    <img src="mufasa.jpg" alt="Mufasa: The Lion King">
                    <div class="movie-info">
                        <h2>Mufasa: The Lion King</h2>
                        <p>December 18, 2024</p>
                    </div>
                </div>
            </main>
        </div>
        <script src="script.js"></script>
    </body>
</html>
