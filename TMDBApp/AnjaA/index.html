<!DOCTYPE html>
<html lang="en">
    <head>
        <title>TMBD app</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <aside class="sidebar">
                <div class="logo">
                    <img src="gg-logo.png" alt="Logo">
                    <h1>TMBD Movies</h1>
                </div>
                <nav>
                    <ul>
                        <li>Popular</li>
                        <li>Now playing</li>
                        <li>Upcoming</li>
                        <li>Top rated</li>
                    </ul>
                </nav>
            </aside>
        
            <main class="content">
                <header class="top-section">
                    <button class="nav-arrow left"></button>
                    <button class="nav-arrow right"></button>
                    <input type="text" placeholder="Search for movies..." class="search-bar">
                </header>

                <div class="featured-movie">
                    <img src="mufasa.jpg" alt="Mufasa: The Lion King">
                    <div class="movie-info">
                        <h2>Mufasa: The Lion King</h2>
                        <p>December 18, 2024</p>
                    </div>
                </div>

                <section class="sort-filter">
                    <div class="sort-container">
                        <h3>Sort</h3>
                        <select id="sort-by">
                            <option>Popularity ascending</option>
                            <option selected>Popularity descending</option>
                            <option>Rating ascending</option>
                            <option>Rating descending</option>
                            <option>Release date ascending</option>
                            <option>Release date descending</option>
                        </select>
                    </div>
                    
                    <div class="filter-container">
                        <h3>Filters</h3>
                        <h4>Release date</h4>
                        <input type="date" id="from-date" placeholder="from">
                        <input type="date" id="to-date" placeholder="to">
                        <h4>Genres</h4>
                        <div class="genre-buttons">
                            <button>Action</button>
                            <button>Horror</button>
                            <button>Comedy</button>
                            <button>Crime</button>
                            <button>Adventure</button>
                        </div>
                        <h4>Language</h4>
                        <select id="language">
                            <option>English</option>
                        </select>
                    </div>
                </section>
            </main>
        </div>
    </body>
</html>
