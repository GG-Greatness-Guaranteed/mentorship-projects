<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Quiz game</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div class="glavna-klasa">
            <div class="kontejner">

                <div class="kategorije">
                    <h2>Categories</h2>
                    
                    <div class="kategorije-dugmici">
                      <button id="music">Music</button>
                      <button id="history">History</button>
                      <button id="science">Science</button>
                      <button id="geography">Geography</button>
                    </div>
                  </div>
            
                    <div class="biranje-tezine">
                        <h2>Difficulty</h2>

                      <div class="tezine-dugmici">
                        <button id="easy">Easy</button>
                        <button id="medium">Medium</button>
                        <button id="hard">Hard</button>
                      </div>
                    </div>

                    <div class="mrceno-dugme">
                        <button class="start-dugme" id="start">Start</button>
                    </div>
            </div>
        </div>

    <script src="script.js"></script>
    </body>


</html>
