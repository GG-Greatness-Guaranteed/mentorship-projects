<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quiz App</title>
        <link rel="stylesheet" href="quiz.css">
    </head>

    <body style="background-color:#1E293B;">
       
        <div id="frame">

            <h3 class="subtitle">Categories</h3>
            <div class="buttonDiv">
                <button class="mainFrameButton" id="music">Music</button>
                <button class="mainFrameButton" id="history">History</button>
                <button class="mainFrameButton" id="science">Science</button>
                <button class="mainFrameButton" id="geography">Geography</button>
            </div>

            <br>

            <h3 class="subtitle">Difficulty</h3>
            <div class="buttonDiv">
                <button class="mainFrameButton" id="easy">Easy</button>
                <button class="mainFrameButton" id="medium">Medium</button>
                <button class="mainFrameButton" id="hard">Hard</button>
            </div>

            <br>

            <button class="mainFrameButton" id="start">Start</button>

        </div>

        <script src="quiz.js"></script>
    </body>

</html>
